name: publish-viewer

# Stages @arch-map/viewer (packages/viewer) on npm when a tag viewer-v<version> is pushed, e.g. viewer-v1.0.1.
# The tag must equal packages/viewer/package.json's version. No token: npm Trusted Publishing (OIDC) — on npmjs.com,
# the package's Settings → Trusted publisher names this repository, this workflow file and the environment `npm`, and
# allows only `npm stage publish`. The version goes live after a maintainer approves it with 2FA: npmjs.com →
# Staged Packages → Approve (or `npm stage approve <id>`). Provenance comes with it.
on:
  push:
    tags: ['viewer-v*']

permissions:
  contents: write   # the GitHub release of the tag
  id-token: write

concurrency:
  group: publish-viewer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - name: The tag is the package version
        run: |
          version=$(node -p "require('./packages/viewer/package.json').version")
          if [ "viewer-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/viewer version $version" >&2
            exit 1
          fi
      - run: npm run check:fast
      # Builds the package and checks it packs only what it should (prepack builds it again on publish).
      - run: npm run lib:pack
      - run: npm stage publish --access public
        working-directory: packages/viewer
      # A GitHub release for the tag; its version reaches npm once it is approved in Staged Packages.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#viewer-v}
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "@arch-map/viewer $version" \
            --notes "npm: https://www.npmjs.com/package/@arch-map/viewer/v/$version

          \`\`\`bash
          npm install @arch-map/viewer@$version
          \`\`\`

          Usage: [docs/embedding.md](https://github.com/tkabanov/arch-map/blob/$GITHUB_REF_NAME/docs/embedding.md)" \
            --generate-notes
