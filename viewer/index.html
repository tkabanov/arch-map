<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arch Map 3D</title>
  <link rel="icon" href="data:,">
  <style>
    /* the page around the map (src/site.ts mounts it into #app; the map's own styles are in its shadow root) */
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: #070a12; }
    #app { height: 100%; }
    @media (max-width: 900px) { body { overflow: auto; } #app { height: auto; --arch-map-narrow-height: auto; --arch-map-narrow-overflow: visible; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
